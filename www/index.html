<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eris Unified</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --bg: #050505; --card: #121214; --text: #fafafa; --accent: #3b82f6; --error: #ef4444; --success: #22c55e; --dim: #71717a; --sidebar-w: 260px; }
    body { background-color: var(--bg); color: var(--text); margin: 0; font-family: system-ui, -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .hidden { display: none !important; }
    #login-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; gap: 1rem; }
    .login-box { background: var(--card); padding: 2rem; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    #on-screen-debug { width: 100%; max-width: 600px; height: 150px; background: #000; border: 1px solid #333; color: #0f0; font-family: monospace; font-size: 0.75rem; overflow-y: auto; padding: 0.5rem; margin-top: 1rem; border-radius: 4px; }
    .container { flex: 1; display: flex; flex-direction: row; height: 100%; overflow: hidden; }
    .sidebar { width: var(--sidebar-w); background: var(--card); display: flex; flex-direction: column; gap: 1.5rem; flex-shrink: 0; border-right: 1px solid #18181b; padding: 1rem; transition: transform 0.3s ease; z-index: 50; }
    .main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
    header { background: var(--card); padding: 0.8rem 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #18181b; }
    .mobile-menu-btn { display: none; background: transparent; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
    #video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; padding: 1rem; max-height: 60vh; overflow-y: auto; background: #000; }
    .video-container { background: #0a0a0a; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; position: relative; border: 1px solid #27272a; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .video-label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.7); padding: 2px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    #messages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; }
    .msg { padding: 0.5rem 0.8rem; border-radius: 6px; background: var(--card); word-break: break-all; max-width: 85%; font-size: 0.95rem; }
    .msg-system { background: transparent; color: var(--dim); font-style: italic; text-align: center; align-self: center; font-size: 0.8rem; }
    .msg-author { color: var(--accent); font-weight: bold; margin-right: 6px; }
    .chat-input-area { padding: 1rem; background: var(--card); border-top: 1px solid #18181b; }
    form { display: flex; gap: 0.5rem; }
    input { flex: 1; background: #0a0a0a; border: 1px solid #27272a; color: white; padding: 0.7rem 1rem; border-radius: 8px; outline: none; }
    input:focus { border-color: var(--accent); }
    .section-title { font-size: 0.7rem; text-transform: uppercase; color: var(--dim); letter-spacing: 1.5px; margin-bottom: 0.5rem; font-weight: 800; }
    .list-nav { list-style: none; padding: 0; margin: 0; }
    .nav-item { padding: 0.6rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 0.7rem; justify-content: space-between; margin-bottom: 2px; }
    .nav-item:hover { background: rgba(255,255,255,0.05); }
    .nav-item.active { background: rgba(59, 130, 246, 0.15); color: var(--accent); font-weight: 600; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .connected { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .disconnected { background: var(--error); }
    .watch-badge { font-size: 0.65rem; background: var(--error); color: white; padding: 2px 6px; border-radius: 4px; font-weight: 900; animation: pulse 2s infinite; }
    #controls-area { margin-top: auto; padding-top: 1rem; border-top: 1px solid #27272a; display: flex; flex-direction: column; gap: 0.5rem; }
    .btn-action { background: #18181b; border: 1px solid #27272a; width: 100%; text-align: left; padding: 0.7rem 1rem; font-size: 0.9rem; border-radius: 8px; color: var(--text); cursor: pointer; transition: all 0.2s; }
    .btn-action:hover { background: #27272a; border-color: var(--dim); }
    .btn-action.active { background: var(--success); border-color: var(--success); color: #000; font-weight: bold; }
    .btn-action i { width: 20px; text-align: center; margin-right: 8px; }
    @media (max-width: 768px) {
        .mobile-menu-btn { display: block; }
        .sidebar { position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
        .sidebar.open { transform: translateX(0); }
        .container { position: relative; }
        .main-area { width: 100%; }
        #video-grid { grid-template-columns: 1fr; }
        .sidebar-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
        .sidebar-overlay.open { display: block; }
    }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body>
  <div id="login-screen">
    <div class="login-box">
      <h1 style="margin-bottom: 0.5rem;">🌑 ERIS</h1>
      <p style="color: var(--dim); margin-bottom: 2rem;">Secure Standalone Hub</p>
      <form id="login-form" style="flex-direction: column; gap: 0.8rem;">
        <input type="text" id="server-input" placeholder="Server (e.g. 127.0.0.1:8080)" autocomplete="off">
        <input type="text" id="token-input" placeholder="Invite Token" autocomplete="off">
        <input type="text" id="username-input" placeholder="Username" required autofocus autocomplete="off">
        <div id="login-error" style="color: var(--error); font-size: 0.8rem; height: 1rem;"></div>
        <button type="submit" id="login-btn" style="padding: 1rem;">Join Server</button>
      </form>
    </div>
    <div id="on-screen-debug">Initializing...</div>
  </div>

  <div id="chat-ui" class="container hidden">
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <div id="sidebar" class="sidebar">
        <div>
            <div class="section-title">Channels</div>
            <ul id="channel-list" class="list-nav">
                <li class="nav-item active" onclick="switchChannel('lobby')"><span><i class="fas fa-hashtag"></i> lobby</span></li>
                <li class="nav-item" onclick="switchChannel('gaming')"><span><i class="fas fa-gamepad"></i> gaming</span></li>
                <li class="nav-item" onclick="switchChannel('voice')"><span><i class="fas fa-microphone"></i> voice-only</span></li>
            </ul>
        </div>
        <div style="flex: 1; overflow-y: auto;"><div class="section-title">Online Peers</div><ul id="peer-list" class="list-nav"></ul></div>
        <div id="controls-area">
            <button id="btn-voice" class="btn-action"><i class="fas fa-phone"></i> Join Voice</button>
            <button id="btn-screen" class="btn-action"><i class="fas fa-desktop"></i> Share Screen</button>
            <button id="btn-logout-mobile" class="btn-action" style="color: var(--error); border-color: #450a0a;"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
    <div class="main-area">
        <header>
          <div style="display: flex; align-items: center; gap: 15px;"><button id="menu-toggle" class="mobile-menu-btn"><i class="fas fa-bars"></i></button><h1 id="current-channel-name" style="margin:0; font-size: 1.1rem;"><i class="fas fa-hashtag"></i> lobby</h1><span id="status-dot" class="status-dot disconnected"></span></div>
          <div style="display: flex; align-items: center; gap: 1rem;"><span id="my-name-display" style="font-size: 0.9rem; color: var(--accent); font-weight: bold;"></span><button id="btn-logout" class="secondary">Logout</button></div>
        </header>
        <div id="video-grid" class="hidden"></div>
        <div id="messages"></div>
        <div class="chat-input-area"><form id="chat-form"><input type="text" id="chat-input" placeholder="Message #lobby" autocomplete="off"><button type="submit">Send</button></form></div>
    </div>
  </div>

  <script>
    // DEFENSIVE ERROR CATCHING
    window.onerror = function(msg, url, line, col, error) {
        alert("FATAL JS ERROR: " + msg + "\nAt: " + url + ":" + line);
        return false;
    };

    const debugEl = document.getElementById('on-screen-debug');
    function screenLog(msg) {
        const line = document.createElement('div');
        line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        debugEl.appendChild(line);
        debugEl.scrollTop = debugEl.scrollHeight;
    }

    screenLog("Script loading...");

    // TAURI INTEGRATION
    const isTauri = !!window.__TAURI_INTERNALS__ || !!window.__TAURI__;
    screenLog("Environment: " + (isTauri ? "Tauri" : "Browser"));
    
    // Explicitly check window.__TAURI__ structure
    if (isTauri) {
        screenLog("Tauri Global found: " + Object.keys(window.__TAURI__).join(','));
    }

    const tauriCore = isTauri ? (window.__TAURI__.core || window.__TAURI__.tauri || window.__TAURI__) : { invoke: null };
    const tauriEvent = isTauri ? (window.__TAURI__.event || window.__TAURI__) : { listen: null };
    const { invoke } = tauriCore;
    const { listen } = tauriEvent;

    if (isTauri && invoke) {
        const originalLog = console.log;
        const originalError = console.error;
        console.log = (...args) => {
            const msg = args.map(a => String(a)).join(' ');
            originalLog(...args);
            screenLog("LOG: " + msg);
            invoke('js_log', { level: 'INFO', message: msg }).catch(e => originalError("Log bridge fail", e));
        };
        console.error = (...args) => {
            const msg = args.map(a => String(a)).join(' ');
            originalError(...args);
            screenLog("ERR: " + msg);
            invoke('js_log', { level: 'ERROR', message: msg }).catch(e => originalError("Log bridge fail", e));
        };
    }

    const STORAGE_KEY = 'eris_username';
    const SERVER_KEY = 'eris_server';
    const TOKEN_KEY = 'eris_token';
    const loginScreen = document.getElementById('login-screen');
    const chatUI = document.getElementById('chat-ui');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    const menuToggle = document.getElementById('menu-toggle');
    const loginForm = document.getElementById('login-form');
    const serverInput = document.getElementById('server-input');
    const tokenInput = document.getElementById('token-input');
    const usernameInput = document.getElementById('username-input');
    const loginError = document.getElementById('login-error');
    const loginBtn = document.getElementById('login-btn');
    const myNameDisplay = document.getElementById('my-name-display');
    const btnLogout = document.getElementById('btn-logout');
    const btnLogoutMobile = document.getElementById('btn-logout-mobile');
    const msgContainer = document.getElementById('messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const statusDot = document.getElementById('status-dot');
    const peerListEl = document.getElementById('peer-list');
    const channelListEl = document.getElementById('channel-list');
    const currentChannelNameEl = document.getElementById('current-channel-name');
    const btnVoice = document.getElementById('btn-voice');
    const btnScreen = document.getElementById('btn-screen');
    const videoGrid = document.getElementById('video-grid');

    let ws;
    let myUsername = localStorage.getItem(STORAGE_KEY) || '';
    let myServer = localStorage.getItem(SERVER_KEY) || (isTauri ? '' : window.location.host);
    let myToken = localStorage.getItem(TOKEN_KEY) || '';
    let myId = '';
    let currentChannel = 'lobby';
    let peers = [];
    let localStream = null;
    let screenStream = null;
    let peerConnections = {}; 
    let inVoice = false;
    let inScreen = false;
    let watchingPeers = new Set();
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };

    serverInput.value = myServer;
    usernameInput.value = myUsername;
    tokenInput.value = myToken;

    menuToggle.onclick = () => { sidebar.classList.add('open'); sidebarOverlay.classList.add('open'); };
    sidebarOverlay.onclick = () => { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('open'); };

    async function connect() {
      try {
          screenLog("Connecting to " + myServer);
          if (!myServer) return;
          let protocol = 'wss:';
          let host = myServer;
          if (host.startsWith('https://')) { protocol = 'wss:'; host = host.replace('https://', ''); }
          else if (host.startsWith('http://')) { protocol = 'ws:'; host = host.replace('http://', ''); }
          else if (host.includes('8080')) { protocol = 'ws:'; }
          
          const urlParams = new URLSearchParams(window.location.search);
          const token = urlParams.get('token') || myToken;
          if (!token) { loginError.innerText = "Invite token required"; loginBtn.disabled = false; return; }
          const url = `${protocol}//${host}/ws?token=${token}`;

          if (isTauri && invoke) {
              screenLog("Invoking Rust connect...");
              try {
                  await invoke('connect_server', { url });
                  statusDot.className = 'status-dot connected';
                  if (myUsername) sendLogin(myUsername);
              } catch (e) {
                  screenLog("Rust Connect Error: " + e);
                  loginError.innerText = "Connection failed: " + e;
                  loginBtn.disabled = false;
              }
          } else {
              screenLog("Browser WebSocket opening...");
              ws = new WebSocket(url);
              ws.onopen = () => { statusDot.className = 'status-dot connected'; if (myUsername) sendLogin(myUsername); };
              ws.onclose = (e) => { statusDot.className = 'status-dot disconnected'; setTimeout(connect, 2000); };
              ws.onmessage = (event) => handleProtocolMsg(JSON.parse(event.data));
              ws.onerror = (e) => { screenLog("WS Error"); loginError.innerText = "Connection error"; loginBtn.disabled = false; };
          }
      } catch (err) { screenLog("Connect fatal: " + err); loginBtn.disabled = false; }
    }

    if (isTauri && listen) {
        listen('protocol-msg', (event) => handleProtocolMsg(event.payload)).then(() => {
            screenLog("Listeners ready");
            invoke('client_ready');
        });
    }

    async function handleProtocolMsg(msg) {
        console.log("Protocol: " + msg.type);
        switch (msg.type) {
            case 'Identify':
                myId = msg.payload.id;
                myUsername = msg.payload.username;
                localStorage.setItem(STORAGE_KEY, myUsername);
                localStorage.setItem(SERVER_KEY, myServer);
                localStorage.setItem(TOKEN_KEY, myToken);
                myNameDisplay.innerText = myUsername;
                loginScreen.classList.add('hidden');
                chatUI.classList.remove('hidden');
                break;
            case 'PeerList': peers = msg.payload.peers; renderPeers(); break;
            case 'ChatMessage': if (msg.payload.channel === currentChannel) addMessage(msg); break;
            case 'ScreenState':
                if (!msg.payload.is_sharing) { removeVideoElement(msg.payload.peer_id); watchingPeers.delete(msg.payload.peer_id); if (videoGrid.children.length === 0) videoGrid.classList.add('hidden'); }
                renderPeers();
                break;
            case 'Signal': handleSignal(msg.payload.target_id, msg.payload.data); break;
            case 'RequestStream': if (inScreen) createPeerConnection(msg.payload.target_id, true); break;
            case 'System': addMessage(msg); break;
        }
    }

    async function sendCommand(msg) {
        if (isTauri && invoke) { await invoke('send_protocol', { msg }); }
        else if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify(msg)); }
    }

    function switchChannel(name) {
        if (name === currentChannel) return;
        const prev = currentChannel; currentChannel = name; msgContainer.innerHTML = '';
        currentChannelNameEl.innerHTML = `<i class="fas fa-${name === 'voice' ? 'microphone' : (name === 'gaming' ? 'gamepad' : 'hashtag')}"></i> ${name}`;
        chatInput.placeholder = `Message #${name}`;
        Array.from(channelListEl.children).forEach(el => { el.classList.toggle('active', el.innerText.toLowerCase().includes(name)); });
        sendCommand({ type: 'JoinChannel', payload: { channel: name } });
        if (inScreen) stopScreen();
        watchingPeers.forEach(id => removeVideoElement(id)); watchingPeers.clear(); videoGrid.classList.add('hidden');
        if (name === 'voice') startVoice(); else if (prev === 'voice' && inVoice) stopVoice(); else if (inVoice) { stopVoice(); startVoice(); }
        renderPeers(); sidebar.classList.remove('open'); sidebarOverlay.classList.remove('open');
    }

    function renderPeers() {
        peerListEl.innerHTML = peers.filter(p => p.channel === currentChannel).map(p => `
            <li class="nav-item" onclick="${p.is_sharing && p.id !== myId ? `watchStream('${p.id}')` : ''}">
                <div style="display:flex; align-items:center; gap:0.5rem"><span class="status-dot connected"></span><span style="${p.id === myId ? 'color: var(--accent); font-weight: bold;' : ''}">${p.username} ${p.id === myId ? '(You)' : ''}</span></div>
                ${p.is_sharing && p.id !== myId ? '<span class="watch-badge">LIVE</span>' : ''}
            </li>
        `).join('');
    }

    async function watchStream(targetId) { if (watchingPeers.has(targetId)) return; watchingPeers.add(targetId); sendCommand({ type: 'RequestStream', payload: { target_id: targetId } }); }
    async function toggleVoice() { if (inVoice) stopVoice(); else await startVoice(); }
    async function startVoice() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            inVoice = true; btnVoice.classList.add('active'); btnVoice.innerHTML = '<i class="fas fa-phone-slash"></i> Leave Voice';
            peers.filter(p => p.id !== myId && p.channel === currentChannel).forEach(peer => createPeerConnection(peer.id, true));
        } catch (err) { screenLog("Mic Error: " + err); }
    }
    function stopVoice() { inVoice = false; btnVoice.classList.remove('active'); btnVoice.innerHTML = '<i class="fas fa-phone"></i> Join Voice'; if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; } cleanupDeadConnections(); }
    async function toggleScreen() { if (inScreen) stopScreen(); else await startScreen(); }
    async function startScreen() {
        try {
            screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: { echoCancellation: false } });
            inScreen = true; btnScreen.classList.add('active'); btnScreen.innerHTML = '<i class="fas fa-stop"></i> Stop Sharing'; videoGrid.classList.remove('hidden');
            addVideoElement('me', screenStream, 'You (Sharing)'); sendCommand({ type: 'ScreenState', payload: { is_sharing: true, peer_id: myId } });
            screenStream.getVideoTracks()[0].onended = () => stopScreen();
            peers.filter(p => p.id !== myId && p.channel === currentChannel).forEach(peer => createPeerConnection(peer.id, true));
        } catch (err) { screenLog("Screen Error: " + err); }
    }
    function stopScreen() { inScreen = false; btnScreen.classList.remove('active'); btnScreen.innerHTML = '<i class="fas fa-desktop"></i> Share Screen'; if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; } removeVideoElement('me'); if (videoGrid.children.length === 0) videoGrid.classList.add('hidden'); sendCommand({ type: 'ScreenState', payload: { is_sharing: false, peer_id: myId } }); cleanupDeadConnections(); }
    function cleanupDeadConnections() { if (!inVoice && !inScreen && watchingPeers.size === 0) { Object.keys(peerConnections).forEach(id => { peerConnections[id].close(); delete peerConnections[id]; }); } }
    function createPeerConnection(targetId, isOfferor) {
        if (peerConnections[targetId]) {
            const pc = peerConnections[targetId]; const s = pc.getSenders();
            if (localStream) localStream.getTracks().forEach(t => { if (!s.find(x => x.track === t)) pc.addTrack(t, localStream); });
            if (screenStream) screenStream.getTracks().forEach(t => { if (!s.find(x => x.track === t)) pc.addTrack(t, screenStream); });
            if (isOfferor) pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => sendSignal(targetId, { sdp: pc.localDescription }));
            return pc;
        }
        const pc = new RTCPeerConnection(rtcConfig); peerConnections[targetId] = pc;
        if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
        if (screenStream) screenStream.getTracks().forEach(t => pc.addTrack(t, screenStream));
        pc.onicecandidate = (e) => e.candidate && sendSignal(targetId, { ice: e.candidate });
        pc.ontrack = (e) => {
            const stream = e.streams[0];
            if (e.track.kind === 'video') { videoGrid.classList.remove('hidden'); addVideoElement(targetId, stream, peers.find(p => p.id === targetId)?.username || 'Peer'); }
            else { const a = document.createElement('audio'); a.autoplay = true; a.srcObject = new MediaStream([e.track]); a.style.display = 'none'; document.body.appendChild(a); e.track.onended = () => a.remove(); }
        };
        if (isOfferor) pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => sendSignal(targetId, { sdp: pc.localDescription }));
        return pc;
    }
    async function handleSignal(fromId, data) {
        let pc = peerConnections[fromId];
        if (data.sdp) {
            if (!pc) pc = createPeerConnection(fromId, false);
            await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
            if (data.sdp.type === 'offer') { const a = await pc.createAnswer(); await pc.setLocalDescription(a); sendSignal(fromId, { sdp: pc.localDescription }); }
        } else if (data.ice && pc) { await pc.addIceCandidate(new RTCIceCandidate(data.ice)); }
    }
    function addVideoElement(id, stream, label) { removeVideoElement(id); const c = document.createElement('div'); c.id = `video-${id}`; c.className = 'video-container'; const v = document.createElement('video'); v.srcObject = stream; v.autoplay = true; v.playsInline = true; if (id === 'me') v.muted = true; const l = document.createElement('div'); l.className = 'video-label'; l.innerText = label; c.appendChild(v); c.appendChild(l); videoGrid.appendChild(c); }
    function removeVideoElement(id) { const el = document.getElementById(`video-${id}`); if (el) el.remove(); }
    function sendSignal(targetId, data) { sendCommand({ type: 'Signal', payload: { target_id: targetId, data } }); }
    function sendLogin(username) { sendCommand({ type: 'Login', payload: { username } }); }
    function addMessage(msg) { const d = document.createElement('div'); if (msg.type === 'ChatMessage') { d.className = 'msg'; const isMe = msg.payload.author === myUsername; if (isMe) d.style.alignSelf = 'flex-end'; d.innerHTML = `<span class="msg-author" style="${isMe ? 'color: #10b981' : ''}">${msg.payload.author}:</span> ${msg.payload.content}`; } else if (msg.type === 'System') { d.className = `msg msg-system`; d.innerText = msg.payload.message; } msgContainer.appendChild(d); msgContainer.scrollTop = msgContainer.scrollHeight; }

    loginForm.onsubmit = (e) => {
      e.preventDefault();
      const user = usernameInput.value.trim();
      const server = serverInput.value.trim();
      const token = tokenInput.value.trim();
      screenLog("Join Click: " + user + " @ " + server);
      if (!user || !server || !token) { loginError.innerText = "All fields required"; return; }
      myUsername = user; myServer = server; myToken = token; loginError.innerText = ''; loginBtn.disabled = true;
      connect();
    };

    chatForm.onsubmit = (e) => {
      e.preventDefault();
      const content = chatInput.value.trim();
      if (!content) return;
      sendCommand({ type: 'ChatMessage', payload: { channel: currentChannel, author: myUsername, content } });
      chatInput.value = '';
    };

    const logout = () => { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(SERVER_KEY); localStorage.removeItem(TOKEN_KEY); window.location.reload(); };
    btnLogout.onclick = logout; btnLogoutMobile.onclick = logout; btnVoice.onclick = toggleVoice; btnScreen.onclick = toggleScreen;
    if (myUsername && myServer && myToken) connect();
    screenLog("Init complete");
  </script>
</body>
</html>
