
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eris Unified</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #050505;
      --card: #121214;
      --text: #fafafa;
      --accent: #3b82f6;
      --error: #ef4444;
      --success: #22c55e;
      --dim: #71717a;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .hidden { display: none !important; }
    
    /* Login Screen */
    #login-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-box {
      background: var(--card);
      padding: 2rem;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    
    /* Main UI */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: row;
      height: 100%;
      padding: 1rem;
      gap: 1rem;
      box-sizing: border-box;
    }
    .main-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }
    .sidebar {
        width: 250px;
        background: var(--card);
        border-radius: 8px;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        flex-shrink: 0;
    }
    header {
      background: var(--card);
      padding: 0.8rem 1rem;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }
    .connected { background: var(--success); }
    .disconnected { background: var(--error); }
    
    #video-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 1rem;
        margin-bottom: 1rem;
    }
    .video-container {
        background: black;
        border-radius: 8px;
        overflow: hidden;
        aspect-ratio: 16/9;
        position: relative;
    }
    video { width: 100%; height: 100%; object-fit: contain; }
    .video-label {
        position: absolute;
        bottom: 8px;
        left: 8px;
        background: rgba(0,0,0,0.6);
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.8rem;
    }

    #messages {
      flex: 1;
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
      padding: 1rem;
      overflow-y: auto;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .msg {
      padding: 0.5rem 0.8rem;
      border-radius: 4px;
      background: var(--card);
      word-break: break-all;
    }
    .msg-system {
      background: transparent;
      color: var(--dim);
      font-style: italic;
      text-align: center;
      font-size: 0.85rem;
    }
    .msg-author {
      color: var(--accent);
      font-weight: bold;
      margin-right: 5px;
    }

    form {
      display: flex;
      gap: 0.5rem;
    }
    input {
      flex: 1;
      background: var(--card);
      border: 1px solid #27272a;
      color: white;
      padding: 0.8rem;
      border-radius: 4px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button.secondary {
        background: transparent;
        border: 1px solid #27272a;
        color: var(--dim);
        padding: 0.4rem 0.8rem;
        font-size: 0.8rem;
    }

    .section-title { font-size: 0.75rem; text-transform: uppercase; color: var(--dim); letter-spacing: 1px; margin-bottom: 0.5rem; }
    .list-nav { list-style: none; padding: 0; margin: 0; }
    .nav-item {
        padding: 0.5rem 0.8rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        justify-content: space-between;
    }
    .nav-item:hover { background: rgba(255,255,255,0.05); }
    .nav-item.active { background: rgba(59, 130, 246, 0.1); color: var(--accent); }
    
    .watch-badge {
        font-size: 0.7rem;
        background: var(--error);
        color: white;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: bold;
        animation: pulse 2s infinite;
    }
    @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.6; }
        100% { opacity: 1; }
    }

    #controls-area {
        margin-top: auto;
        padding-top: 1rem;
        border-top: 1px solid #27272a;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    .btn-action { background: #18181b; border: 1px solid #27272a; width: 100%; text-align: left; padding: 0.6rem 0.8rem; font-size: 0.9rem; border-radius: 4px; color: var(--text); cursor: pointer; }
    .btn-action:hover { background: rgba(255,255,255,0.05); }
    .btn-action.active { background: var(--success); border-color: var(--success); }
    .btn-action i { width: 20px; text-align: center; margin-right: 5px; }
  </style>
</head>
<body>
  <div id="login-screen">
    <div class="login-box">
      <h1 style="margin-top:0">🌑 ERIS</h1>
      <p style="color: var(--dim)">Enter a username to join</p>
      <form id="login-form" style="flex-direction: column;">
        <input type="text" id="username-input" placeholder="Username" required autofocus autocomplete="off">
        <div id="login-error" style="color: var(--error); font-size: 0.8rem; margin-top: 0.5rem; height: 1rem;"></div>
        <button type="submit" id="login-btn">Join Server</button>
      </form>
    </div>
  </div>

  <div id="chat-ui" class="container hidden">
    <div class="sidebar">
        <div>
            <div class="section-title">Channels</div>
            <ul id="channel-list" class="list-nav">
                <li class="nav-item active" onclick="switchChannel('lobby')"><span><i class="fas fa-hashtag"></i> lobby</span></li>
                <li class="nav-item" onclick="switchChannel('gaming')"><span><i class="fas fa-gamepad"></i> gaming</span></li>
                <li class="nav-item" onclick="switchChannel('voice')"><span><i class="fas fa-microphone"></i> voice-only</span></li>
            </ul>
        </div>

        <div style="flex: 1; overflow-y: auto;">
            <div class="section-title">Online Peers</div>
            <ul id="peer-list" class="list-nav"></ul>
        </div>
        
        <div id="controls-area">
            <button id="btn-voice" class="btn-action"><i class="fas fa-phone"></i> Join Voice</button>
            <button id="btn-screen" class="btn-action"><i class="fas fa-desktop"></i> Share Screen</button>
        </div>
    </div>

    <div class="main-area">
        <header>
          <div style="display: flex; align-items: center; gap: 10px;">
            <h1 id="current-channel-name" style="margin:0; font-size: 1.1rem;"><i class="fas fa-hashtag"></i> lobby</h1>
            <span id="status-dot" class="status-dot disconnected"></span>
          </div>
          <div style="display: flex; align-items: center; gap: 1rem;">
            <span id="my-name-display" style="font-size: 0.9rem; color: var(--accent); font-weight: bold;"></span>
            <button id="btn-logout" class="secondary">Logout</button>
          </div>
        </header>

        <div id="video-grid" class="hidden"></div>
        <div id="messages"></div>

        <form id="chat-form">
          <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
          <button type="submit">Send</button>
        </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'eris_username';
    const loginScreen = document.getElementById('login-screen');
    const chatUI = document.getElementById('chat-ui');
    const loginForm = document.getElementById('login-form');
    const usernameInput = document.getElementById('username-input');
    const loginError = document.getElementById('login-error');
    const loginBtn = document.getElementById('login-btn');
    const myNameDisplay = document.getElementById('my-name-display');
    const btnLogout = document.getElementById('btn-logout');
    const msgContainer = document.getElementById('messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const statusDot = document.getElementById('status-dot');
    const peerListEl = document.getElementById('peer-list');
    const channelListEl = document.getElementById('channel-list');
    const currentChannelNameEl = document.getElementById('current-channel-name');
    const btnVoice = document.getElementById('btn-voice');
    const btnScreen = document.getElementById('btn-screen');
    const videoGrid = document.getElementById('video-grid');

    let ws;
    let myUsername = localStorage.getItem(STORAGE_KEY) || '';
    let myId = '';
    let currentChannel = 'lobby';
    let peers = [];
    
    let localStream = null;
    let screenStream = null;
    let peerConnections = {}; 
    let inVoice = false;
    let inScreen = false;
    let watchingPeers = new Set();

    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    function connect() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token') || prompt("Enter token:");
      ws = new WebSocket(`${protocol}//${window.location.host}/ws?token=${token}`);

      ws.onopen = () => {
        statusDot.className = 'status-dot connected';
        if (myUsername) sendLogin(myUsername);
      };

      ws.onclose = () => {
        statusDot.className = 'status-dot disconnected';
        setTimeout(connect, 2000);
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        switch (msg.type) {
            case 'Identify':
                myId = msg.payload.id;
                myUsername = msg.payload.username;
                localStorage.setItem(STORAGE_KEY, myUsername);
                myNameDisplay.innerText = myUsername;
                loginScreen.classList.add('hidden');
                chatUI.classList.remove('hidden');
                break;
            case 'PeerList':
                peers = msg.payload.peers;
                renderPeers();
                break;
            case 'ChatMessage':
                if (msg.payload.channel === currentChannel) addMessage(msg);
                break;
            case 'ScreenState':
                if (!msg.payload.is_sharing) {
                    removeVideoElement(msg.payload.peer_id);
                    watchingPeers.delete(msg.payload.peer_id);
                    if (videoGrid.children.length === 0) videoGrid.classList.add('hidden');
                }
                renderPeers();
                break;
            case 'Signal':
                handleSignal(msg.payload.target_id, msg.payload.data);
                break;
            case 'RequestStream':
                if (inScreen) createPeerConnection(msg.payload.target_id, true);
                break;
            case 'System':
                addMessage(msg);
                break;
        }
      };
    }

    function switchChannel(name) {
        if (name === currentChannel) return;
        const previousChannel = currentChannel;
        currentChannel = name;
        msgContainer.innerHTML = '';
        currentChannelNameEl.innerHTML = `<i class="fas fa-${name === 'voice' ? 'microphone' : (name === 'gaming' ? 'gamepad' : 'hashtag')}"></i> ${name}`;
        
        Array.from(channelListEl.children).forEach(el => {
            el.classList.toggle('active', el.innerText.toLowerCase().includes(name));
        });

        ws.send(JSON.stringify({ type: 'JoinChannel', payload: { channel: name } }));
        
        if (inScreen) stopScreen();
        watchingPeers.forEach(id => removeVideoElement(id));
        watchingPeers.clear();
        if (videoGrid.children.length === 0) videoGrid.classList.add('hidden');

        if (name === 'voice') {
            startVoice();
        } else if (previousChannel === 'voice' && inVoice) {
            stopVoice();
        } else if (inVoice) {
            stopVoice();
            startVoice();
        }

        renderPeers();
    }

    function renderPeers() {
        peerListEl.innerHTML = peers
            .filter(p => p.channel === currentChannel)
            .map(p => `
                <li class="nav-item" onclick="${p.is_sharing && p.id !== myId ? `watchStream('${p.id}')` : ''}">
                    <div style="display:flex; align-items:center; gap:0.5rem">
                        <span class="status-dot connected"></span>
                        <span style="${p.id === myId ? 'color: var(--accent); font-weight: bold;' : ''}">${p.username} ${p.id === myId ? '(You)' : ''}</span>
                    </div>
                    ${p.is_sharing && p.id !== myId ? '<span class="watch-badge">LIVE</span>' : ''}
                </li>
            `).join('');
    }

    async function watchStream(targetId) {
        if (watchingPeers.has(targetId)) return;
        watchingPeers.add(targetId);
        ws.send(JSON.stringify({ type: 'RequestStream', payload: { target_id: targetId } }));
    }

    async function toggleVoice() {
        if (inVoice) stopVoice(); else await startVoice();
    }

    async function startVoice() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            inVoice = true;
            btnVoice.classList.add('active');
            btnVoice.innerHTML = '<i class="fas fa-phone-slash"></i> Leave Voice';
            peers.filter(p => p.id !== myId && p.channel === currentChannel).forEach(peer => createPeerConnection(peer.id, true));
        } catch (err) {
            addMessage({ type: 'System', payload: { message: "Mic access denied", severity: 'error' }});
        }
    }

    function stopVoice() {
        inVoice = false;
        btnVoice.classList.remove('active');
        btnVoice.innerHTML = '<i class="fas fa-phone"></i> Join Voice';
        if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
        cleanupDeadConnections();
    }

    async function toggleScreen() {
        if (inScreen) stopScreen(); else await startScreen();
    }

    async function startScreen() {
        try {
            screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            inScreen = true;
            btnScreen.classList.add('active');
            btnScreen.innerHTML = '<i class="fas fa-stop"></i> Stop Sharing';
            videoGrid.classList.remove('hidden');
            
            addVideoElement('me', screenStream, 'You (Sharing)');
            ws.send(JSON.stringify({ type: 'ScreenState', payload: { is_sharing: true, peer_id: myId } }));

            screenStream.getVideoTracks()[0].onended = () => stopScreen();
        } catch (err) {
            console.error(err);
        }
    }

    function stopScreen() {
        inScreen = false;
        btnScreen.classList.remove('active');
        btnScreen.innerHTML = '<i class="fas fa-desktop"></i> Share Screen';
        if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }
        removeVideoElement('me');
        if (videoGrid.children.length === 0) videoGrid.classList.add('hidden');
        ws.send(JSON.stringify({ type: 'ScreenState', payload: { is_sharing: false, peer_id: myId } }));
        cleanupDeadConnections();
    }

    function cleanupDeadConnections() {
        if (!inVoice && !inScreen && watchingPeers.size === 0) {
            Object.keys(peerConnections).forEach(id => {
                peerConnections[id].close();
                delete peerConnections[id];
            });
        }
    }

    function createPeerConnection(targetId, isOfferor) {
        if (peerConnections[targetId]) {
            // If already exists, add new tracks if any
            if (screenStream) screenStream.getTracks().forEach(t => {
                if (!peerConnections[targetId].getSenders().find(s => s.track === t)) {
                    peerConnections[targetId].addTrack(t, screenStream);
                }
            });
            return peerConnections[targetId];
        }
        
        const pc = new RTCPeerConnection(rtcConfig);
        peerConnections[targetId] = pc;

        if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
        if (screenStream) screenStream.getTracks().forEach(t => pc.addTrack(t, screenStream));

        pc.onicecandidate = (e) => e.candidate && sendSignal(targetId, { ice: e.candidate });
        
        pc.ontrack = (e) => {
            const stream = e.streams[0];
            if (e.track.kind === 'video') {
                videoGrid.classList.remove('hidden');
                const peer = peers.find(p => p.id === targetId);
                addVideoElement(targetId, stream, peer ? peer.username : 'Peer');
            } else {
                // Audio track (could be mic or screen audio)
                const audio = new Audio();
                audio.srcObject = stream;
                audio.play();
            }
        };

        if (isOfferor) {
            pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => sendSignal(targetId, { sdp: pc.localDescription }));
        }

        return pc;
    }

    async function handleSignal(fromId, data) {
        let pc = peerConnections[fromId];
        if (data.sdp) {
            if (!pc) pc = createPeerConnection(fromId, false);
            await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
            if (data.sdp.type === 'offer') {
                const a = await pc.createAnswer();
                await pc.setLocalDescription(a);
                sendSignal(fromId, { sdp: pc.localDescription });
            }
        } else if (data.ice && pc) {
            await pc.addIceCandidate(new RTCIceCandidate(data.ice));
        }
    }

    function addVideoElement(id, stream, label) {
        removeVideoElement(id);
        const container = document.createElement('div');
        container.id = `video-${id}`;
        container.className = 'video-container';
        const video = document.createElement('video');
        video.srcObject = stream;
        video.autoplay = true;
        video.playsInline = true;
        if (id === 'me') video.muted = true;
        const divLabel = document.createElement('div');
        divLabel.className = 'video-label';
        divLabel.innerText = label;
        container.appendChild(video);
        container.appendChild(divLabel);
        videoGrid.appendChild(container);
    }

    function removeVideoElement(id) {
        const el = document.getElementById(`video-${id}`);
        if (el) el.remove();
    }

    function sendSignal(targetId, data) {
        ws.send(JSON.stringify({ type: 'Signal', payload: { target_id: targetId, data } }));
    }

    function sendLogin(username) {
        ws.send(JSON.stringify({ type: 'Login', payload: { username } }));
    }

    function addMessage(msg) {
      const div = document.createElement('div');
      if (msg.type === 'ChatMessage') {
        div.className = 'msg';
        const isMe = msg.payload.author === myUsername;
        div.innerHTML = `<span class="msg-author" style="${isMe ? 'color: #10b981' : ''}">${msg.payload.author}:</span> ${msg.payload.content}`;
      } else if (msg.type === 'System') {
        div.className = `msg msg-system`;
        div.innerText = msg.payload.message;
      }
      msgContainer.appendChild(div);
      msgContainer.scrollTop = msgContainer.scrollHeight;
    }

    loginForm.onsubmit = (e) => {
      e.preventDefault();
      const user = usernameInput.value.trim();
      if (!user) return;
      myUsername = user;
      loginBtn.disabled = true;
      if (ws.readyState === WebSocket.OPEN) sendLogin(user);
    };

    chatForm.onsubmit = (e) => {
      e.preventDefault();
      const content = chatInput.value.trim();
      if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'ChatMessage', payload: { channel: currentChannel, author: myUsername, content } }));
      chatInput.value = '';
    };

    btnLogout.onclick = () => { localStorage.removeItem(STORAGE_KEY); window.location.reload(); };
    btnVoice.onclick = toggleVoice;
    btnScreen.onclick = toggleScreen;
    connect();
  </script>
</body>
</html>
